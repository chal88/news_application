{% extends "news_app/base.html" %}

{% block title %}Edit Article{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">✏️ Edit Article</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{% url 'editor_dashboard' %}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
