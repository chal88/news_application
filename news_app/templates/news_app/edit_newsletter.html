{% extends "news_app/base.html" %}

{% block title %}Edit Newsletter{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Newsletter</h2>

    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}

        <!-- Title -->
        <div class="mb-3">
            <label for="id_title" class="form-label">Title</label>
            {{ form.title }}
            <div class="invalid-feedback">
                Please provide a title.
            </div>
        </div>

        <!-- Content -->
        <div class="mb-3">
            <label for="id_content" class="form-label">Content</label>
            {{ form.content }}
            <div class="invalid-feedback">
                Content cannot be empty.
            </div>
        </div>

        <!-- Optional: Publishing House -->
        <div class="mb-3">
            <label for="id_publishing_house" class="form-label">Publishing House (optional)</label>
            {{ form.publishing_house }}
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'journalist_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
    // Bootstrap form validation
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
{% endblock %}
