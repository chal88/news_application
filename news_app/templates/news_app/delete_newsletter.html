{% extends "news_app/base.html" %}

{% block title %}Delete Newsletter{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Newsletter</h2>
    <p>Are you sure you want to delete the newsletter: <strong>{{ newsletter.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'journalist_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
